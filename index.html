async function syncStateToSupabase(){
  try{
    const response=await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?on_conflict=id`,{
      method:"POST",
      headers:{"apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal"},
      body:JSON.stringify({id:SUPABASE_ROW_ID,data:state,updated_at:new Date().toISOString()})
    });
    if(!response.ok)throw new Error(await response.text());
  }catch(error){console.error("No se pudo sincronizar Zare’s Books:",error);toast("No se pudo sincronizar");}
}
async function loadStateFromSupabase(){
  try{
    const response=await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLE}?id=eq.${SUPABASE_ROW_ID}&select=data`,{
      headers:{"apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`}
    });
    if(!response.ok)throw new Error(await response.text());
    const rows=await response.json();
    if(rows.length&&rows[0].data){
      state=rows[0].data;
      if(!state.annual)state.annual=defaultAnnual();
      if(!state.years)state.years=[2025,2026];
      if(!state.genres)state.genres=[...genres];
      localSave();
      render();
    }else{
      await syncStateToSupabase();
    }
    remoteReady=true;
    toast("Biblioteca sincronizada");
  }catch(error){
    console.error("No se pudo cargar Zare’s Books:",error);
    toast("Modo local: falta configurar la base de datos");
  }
}

function choiceSelect(k,val,books){return `<select style="width:100%;padding:10px;border:1px solid #ddcfc0;border-radius:8px;background:#fffdf9" onchange="setAnnualValue('${k}',this.value)"><option value="">Elegir</option>${books.map(b=>`<option value="${b.id}" ${val===b.id?"selected":""}>${esc(b.title)}</option>`).join("")}</select>`}
function toggleRanking(id){const a=state.annual[currentYear].ranking;const i=a.indexOf(id);if(i>=0)a.splice(i,1);else a.push(id);save();renderYear()}

function renderQuotes(v,d){
 v.innerHTML=`<div class="annual-title"><div><h2>Frases top</h2><span>Guarda las frases que quieres recordar.</span></div><button class="dark-btn" onclick="addQuote()">＋ Agregar frase</button></div>
 <div class="quote-list">${d.quotes.length?d.quotes.map((q,i)=>`<div class="quote" style="display:flex;justify-content:space-between;gap:12px"><span>“${esc(q.text)}”${q.bookId?` — ${esc(bookBy(q.bookId)?.title||"")}`:""}</span><button class="light-btn" onclick="deleteQuote(${i})">×</button></div>`).join(""):`<div class="empty">Todavía no hay frases top.</div>`}</div>`
}
function addQuote(){
 const opts=state.books.filter(b=>b.status==="leido").sort((a,b)=>a.title.localeCompare(b.title));
 document.getElementById("modal").innerHTML=`<div class="modal-head"><h3>＋ Agregar frase top</h3><button class="close" type="button" onclick="closeModal()">×</button></div>
 <div class="form" style="box-shadow:none;padding:18px 0 0">
   <div class="field"><label>Frase</label><textarea id="quoteText" rows="5" placeholder="Escribe aquí la frase que quieres guardar..."></textarea></div>
   <div class="field"><label>Libro</label><select id="quoteBook"><option value="">— Seleccionar libro —</option>${opts.map(b=>`<option value="${b.id}">${esc(b.title)}</option>`).join("")}</select></div>
   <div class="form-actions"><button class="light-btn" type="button" onclick="closeModal()">Cancelar</button><button class="dark-btn" type="button" onclick="saveQuoteFromModal()">Agregar frase</button></div>
 </div>`;
 document.getElementById("modalBack").classList.add("show");
 setTimeout(()=>document.getElementById("quoteText")?.focus(),0);
}
function saveQuoteFromModal(){
 const text=String(document.getElementById("quoteText")?.value||"").trim();
 const bookId=String(document.getElementById("quoteBook")?.value||"");
 if(!text){toast("Escribe una frase");return;}
 const d=state.annual[currentYear];
 if(!d.quotes)d.quotes=[];
 d.quotes.push({text,bookId});
 save();
 render();
 closeModal();
 toast("Frase top agregada");
}
function deleteQuote(i){state.annual[currentYear].quotes.splice(i,1);save();renderYear()}

function renderAnnualStats(v,d){
 const books=annualBooks(),pages=books.reduce((a,b)=>a+(+b.pages||0),0),audio=books.reduce((a,b)=>a+(b.format==="Audiolibro"?b.durationMinutes||0:0),0),avg=books.filter(b=>b.rating).length?(books.filter(b=>b.rating).reduce((a,b)=>a+b.rating,0)/books.filter(b=>b.rating).length).toFixed(1):"—";
 const mc=months.map((m,i)=>books.filter(b=>b.month===i+1).length),max=Math.max(1,...mc);
 v.innerHTML=`<div class="annual-title"><div><h2>Estadísticas ${currentYear}</h2><span>Solo este año, separado de tus estadísticas generales.</span></div></div>
 <div class="grid stats-cards"><div class="stat"><div class="l">Libros</div><div class="n">${books.length}</div></div><div class="stat"><div class="l">Páginas</div><div class="n">${pages}</div></div><div class="stat"><div class="l">Promedio</div><div class="n">${avg}</div></div><div class="stat"><div class="l">🎧 Audiolibros</div><div class="n">${formatDuration(audio)}</div></div></div>
 <section class="card" style="margin-top:18px"><h3>Libros al mes</h3><div class="chart-list">${months.map((m,i)=>`<div class="bar-row"><span>${m}</span><div class="bar-track"><div class="bar-fill" style="width:${mc[i]/max*100}%"></div></div><strong>${mc[i]}</strong></div>`).join("")}</div></section>
 <section class="card" style="margin-top:18px"><h3>Meta anual</h3><div style="display:flex;gap:10px;align-items:center"><input type="number" min="0" value="${d.goal||""}" placeholder="Libros" style="padding:10px;border:1px solid #ddcfc0;border-radius:8px" onchange="setAnnualValue('goal',+this.value||0)"><span>${d.goal?Math.round(books.length/d.goal*100)+"% completado":"Define una meta"}</span></div></section>`
}

function openBook(idv){
 const b=bookBy(idv);if(!b)return;
 document.getElementById("modal").innerHTML=`<div class="modal-head"><h3>${esc(b.title)}</h3><button class="close" onclick="closeModal()">×</button></div>
 <div class="detail"><div class="cover">${coverHtml(b)}</div><div><h2>${esc(b.title)}</h2><div style="color:#9b8065;margin-top:6px">${esc(b.author||"Autor no añadido")}</div>${b.rating?`<div class="stars" style="font-size:17px">${stars(b.rating)}</div>`:""}
 <div class="tagrow">${genreListForBook(b).map(g=>`<span class="tag">${esc(g)}</span>`).join("")}${b.format?`<span class="tag">${esc(b.format)}</span>`:""}${b.durationMinutes?`<span class="tag">${formatDuration(b.durationMinutes)}</span>`:""}${b.favorite?`<span class="tag">♥ Favorito</span>`:""}</div>
 <p><strong>Páginas:</strong> ${b.pages||"—"}<br><strong>Estado:</strong> ${b.status}<br><strong>Año:</strong> ${b.year||"—"}${b.month?`<br><strong>Mes:</strong> ${months[b.month-1]}`:""}</p>
 ${b.review?`<p><strong>Reseña</strong><br>${esc(b.review)}</p>`:""}
 <div class="actions"><button class="dark-btn" onclick="openBookForm('${b.id}')">Editar</button><button class="light-btn" onclick="toggleFavorite('${b.id}')">${b.favorite?"♥ Quitar favorito":"♥ Favorito"}</button><button class="light-btn" onclick="closeModal()">Cerrar</button><button class="danger"  type="button" onclick="event.preventDefault();event.stopPropagation();deleteBook('${b.id}')">Eliminar</button></div></div></div>`;
 document.getElementById("modalBack").classList.add("show")
}
function openReview(idv){
 const b=bookBy(idv);if(!b)return;
 document.getElementById("modal").innerHTML=`<div class="modal-head"><h3>${esc(b.title)}</h3><button class="close" type="button" onclick="closeModal()">×</button></div>
 <div class="review-detail"><div><div class="cover">${coverHtml(b)}</div>${b.author?`<div class="review-author">${esc(b.author)}</div>`:""}</div><div class="review-text">${esc(b.review||"Texto de reseña")}</div><div class="review-actions"><button class="dark-btn" type="button" onclick="openBookForm('${b.id}')">Editar</button><button class="light-btn" type="button" onclick="closeModal()">Cerrar</button><button class="danger" type="button" onclick="event.preventDefault();event.stopPropagation();deleteBook('${b.id}')">Eliminar</button></div></div>`;
 document.getElementById("modalBack").classList.add("show")
}
function closeModal(){document.getElementById("modalBack").classList.remove("show")}
document.getElementById("modalBack").addEventListener("click",e=>{if(e.target.id==="modalBack")closeModal()})
function toggleFavorite(idv){const b=bookBy(idv);b.favorite=!b.favorite;save();closeModal();render();toast(b.favorite?"Añadido a favoritos":"Quitado de favoritos")}
function deleteBook(id){
 const bookId=String(id||"").trim();
 const idx=state.books.findIndex(b=>String(b.id)===bookId);
 if(idx<0){toast("No encontré ese libro");return false;}
 state.books.splice(idx,1);
 save();
 render();
 toast("Libro eliminado");
 return true;
}
let genreSelections=[];
function toggleGenreOption(i){const g=state.genres[i];if(!g)return;const idx=genreSelections.findIndex(x=>x.toLowerCase()===g.toLowerCase());if(idx>=0)genreSelections.splice(idx,1);else genreSelections.push(g);document.getElementById("genrePicker").innerHTML=state.genres.map((x,j)=>`<button type="button" class="genre-option ${genreSelections.some(g=>g.toLowerCase()===x.toLowerCase())?"selected":""}" onclick="toggleGenreOption(${j})">${esc(x)}</button>`).join("")}
function addGenreOption(){const input=document.getElementById("fGenreNew"),g=input?.value.trim()||"";if(!g)return;if(!state.genres.some(x=>x.toLowerCase()===g.toLowerCase()))state.genres.push(g);if(!genreSelections.some(x=>x.toLowerCase()===g.toLowerCase()))genreSelections.push(g);if(input)input.value="";document.getElementById("genrePicker").innerHTML=state.genres.map((x,j)=>`<button type="button" class="genre-option ${genreSelections.some(s=>s.toLowerCase()===x.toLowerCase())?"selected":""}" onclick="toggleGenreOption(${j})">${esc(x)}</button>`).join("")}
function openBookForm(editId=null,yearPreset=null){
 const b=editId?bookBy(editId):{title:"",author:"",cover:"",genre:"",pages:"",rating:0,heart:0,cry:0,spicy:0,plot:0,startDate:"",endDate:"",status:"por-leer",category:"autoconclusivo",group:"",review:"",favorite:false,year:yearPreset||new Date().getFullYear(),month:"",format:"",durationMinutes:null};
 genreSelections=genreListForBook(b);
 genreSelections.forEach(g=>{if(!state.genres.some(x=>x.toLowerCase()===g.toLowerCase()))state.genres.push(g)});
 document.getElementById("modal").innerHTML=`<div class="modal-head"><h3>${editId?"Editar libro":"Agregar libro"}</h3><button class="close" onclick="closeModal()">×</button></div>
 <form class="form" style="box-shadow:none;padding:18px 0 0" onsubmit="saveBook(event,'${editId||""}')">
 <div class="form-grid">
  <div class="field full"><label>Portada</label><div class="upload"><div id="coverPreview">${b.cover?`<img src="${b.cover}">`:`<span>＋ Agregar portada</span>`}</div><input id="fCover" type="file" accept="image/*" onchange="previewCover(event)"></div></div>
  <div class="field"><label>Título *</label><input id="fTitle" required value="${esc(b.title)}"></div>
  <div class="field"><label>Autor</label><input id="fAuthor" value="${esc(b.author||"")}"></div>
  <div class="field full"><label>Géneros</label><div id="genrePicker" class="genre-picker">${state.genres.map((g,i)=>`<button type="button" class="genre-option ${genreSelections.includes(g)?"selected":""}" onclick="toggleGenreOption(${i})">${esc(g)}</button>`).join("")}</div><div style="display:flex;gap:7px"><input id="fGenreNew" placeholder="Escribe otro género"><button type="button" class="light-btn" onclick="addGenreOption()">Agregar</button></div><div class="book-author">Puedes seleccionar varios géneros.</div></div>
  <div class="field"><label>Páginas</label><input id="fPages" type="number" min="0" value="${b.pages||""}"></div>
  <div class="field"><label>Estado</label><select id="fStatus"><option value="por-leer" ${b.status==="por-leer"?"selected":""}>Por leer</option><option value="leyendo" ${b.status==="leyendo"?"selected":""}>Leyendo</option><option value="leido" ${b.status==="leido"?"selected":""}>Leído</option></select></div>
  <div class="field"><label>Formato</label><select id="fFormat" onchange="toggleAudio()"><option value="">Seleccionar</option><option value="Audiolibro" ${b.format==="Audiolibro"?"selected":""}>🎧 Audiolibro</option><option value="Físico" ${b.format==="Físico"?"selected":""}>📖 Físico</option><option value="Digital" ${b.format==="Digital"?"selected":""}>📱 Digital</option></select></div>
  <div class="field" id="audioField" style="display:${b.format==="Audiolibro"?"flex":"none"}"><label>Duración</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px"><input id="fHours" type="number" min="0" placeholder="Horas" value="${b.durationMinutes?Math.floor(b.durationMinutes/60):""}"><input id="fMinutes" type="number" min="0" max="59" placeholder="Minutos" value="${b.durationMinutes?b.durationMinutes%60:""}"></div></div>
  <div class="field"><label>Año de lectura</label><input id="fYear" type="number" min="1900" max="2200" value="${b.year||""}"></div>
  <div class="field"><label>Mes</label><select id="fMonth"><option value="">Sin mes</option>${months.map((m,i)=>`<option value="${i+1}" ${+b.month===i+1?"selected":""}>${m}</option>`).join("")}</select></div>
  <div class="field"><label>Fecha de inicio</label><input id="fStart" type="date" value="${b.startDate||""}"></div>
  <div class="field"><label>Fecha de finalización</label><input id="fEnd" type="date" value="${b.endDate||""}"></div>
  <div class="field"><label>Categoría</label><select id="fCategory"><option value="saga" ${b.category==="saga"?"selected":""}>Saga</option><option value="trilogia" ${b.category==="trilogia"?"selected":""}>Trilogía</option><option value="bilogia" ${b.category==="bilogia"?"selected":""}>Bilogía</option><option value="autoconclusivo" ${b.category==="autoconclusivo"?"selected":""}>Autoconclusivo</option></select></div>
  <div class="field"><label>Agrupación</label><input id="fGroup" value="${esc(b.group||"")}" placeholder="Ej. Twisted, Royal Elite..."></div>
  <div class="field full"><label>Calificaciones</label><div class="rating-box">
   <div class="rating-row"><span class="label">⭐</span>${[1,2,3,4,5].map(n=>`<button type="button" class="${b.rating>=n?"selected":""}" onclick="setRating('rating',${n})">⭐</button>`).join("")}</div>
   <div class="rating-row"><span class="label">❤️</span>${[1,2,3,4,5].map(n=>`<button type="button" class="${b.heart>=n?"selected":""}" onclick="setRating('heart',${n})">❤️</button>`).join("")}</div>
   <div class="rating-row"><span class="label">💧</span>${[1,2,3,4,5].map(n=>`<button type="button" class="${b.cry>=n?"selected":""}" onclick="setRating('cry',${n})">💧</button>`).join("")}</div>
   <div class="rating-row"><span class="label">🔥</span>${[1,2,3,4,5].map(n=>`<button type="button" class="${b.spicy>=n?"selected":""}" onclick="setRating('spicy',${n})">🔥</button>`).join("")}</div>
   <div class="rating-row"><span class="label">💣</span>${[1,2,3,4,5].map(n=>`<button type="button" class="${b.plot>=n?"selected":""}" onclick="setRating('plot',${n})">💣</button>`).join("")}</div>
  </div></div>
  <div class="field full"><label>Reseña</label><textarea id="fReview">${esc(b.review||"")}</textarea></div>
  <div class="field"><label>Favorito</label><select id="fFav"><option value="0" ${!b.favorite?"selected":""}>No</option><option value="1" ${b.favorite?"selected":""}>♥ Sí</option></select></div>
 </div>
 <div class="form-actions"><button type="button" class="light-btn" onclick="closeModal()">Cancelar</button><button class="dark-btn">Guardar libro</button></div></form>`;
 window.formRating={rating:b.rating||0,heart:b.heart||0,cry:b.cry||0,spicy:b.spicy||0,plot:b.plot||0,cover:b.cover||""};
 genreSelections=genreListForBook(b);
 document.getElementById("modalBack").classList.add("show")
}
function setRating(k,n){window.formRating[k]=window.formRating[k]===n?0:n;openBookFormFromState()}
function openBookFormFromState(){const vals=window.formRating;document.querySelectorAll(".rating-row").forEach((row,i)=>row.querySelectorAll("button").forEach((b,j)=>b.classList.toggle("selected",vals[["rating","heart","cry","spicy","plot"][i]]>=j+1)))}
function previewCover(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{window.formRating.cover=r.result;document.getElementById("coverPreview").innerHTML=`<img src="${r.result}">`};r.readAsDataURL(f)}
function toggleAudio(){const x=document.getElementById("audioField");x.style.display=document.getElementById("fFormat").value==="Audiolibro"?"flex":"none"}
function saveBook(e,editId){
 e.preventDefault();const title=document.getElementById("fTitle").value.trim(),dup=uniqueBook(title,editId);if(dup){alert("Ese libro ya existe en tu biblioteca. Se utilizará el mismo registro.");openBook(dup.id);return}
 const existing=editId?bookBy(editId):null;const r=window.formRating||{};
 const typedGenre=document.getElementById("fGenreNew")?.value.trim()||"";if(typedGenre&&!genreSelections.some(g=>g.toLowerCase()===typedGenre.toLowerCase())){genreSelections.push(typedGenre);if(!state.genres.some(g=>g.toLowerCase()===typedGenre.toLowerCase()))state.genres.push(typedGenre)}const genre=[...new Map(genreSelections.map(g=>[g.toLowerCase(),g])).values()].join(", ");
 const format=document.getElementById("fFormat").value;const hrs=+(document.getElementById("fHours")?.value||0),mins=+(document.getElementById("fMinutes")?.value||0);
 const b=existing||{id:id()};Object.assign(b,{title,author:document.getElementById("fAuthor").value.trim(),cover:r.cover||existing?.cover||"",genre,pages:+document.getElementById("fPages").value||null,rating:r.rating||0,heart:r.heart||0,cry:r.cry||0,spicy:r.spicy||0,plot:r.plot||0,status:document.getElementById("fStatus").value,format, durationMinutes:format==="Audiolibro"?(hrs*60+mins||null):null,year:+document.getElementById("fYear").value||null,month:+document.getElementById("fMonth").value||null,startDate:document.getElementById("fStart").value,endDate:document.getElementById("fEnd").value,category:document.getElementById("fCategory").value,group:document.getElementById("fGroup").value.trim(),review:document.getElementById("fReview").value.trim(),favorite:document.getElementById("fFav").value==="1"});
 if(!existing)state.books.push(b);save();closeModal();render();toast(existing?"Libro actualizado":"Libro agregado")}
function openGroupForm(cat){
 const singular={saga:"saga",trilogia:"trilogía",bilogia:"bilogía",autoconclusivo:"autoconclusivo"}[cat], count={saga:0,trilogia:3,bilogia:2,autoconclusivo:1}[cat];
 document.getElementById("modal").innerHTML=`<div class="modal-head"><h3>＋ Agregar ${singular}</h3><button class="close" onclick="closeModal()">×</button></div>
 <div class="form" style="box-shadow:none;padding:18px 0 0"><div class="form-grid">
 <div class="field"><label>Nombre de la ${singular}</label><input id="gName" required placeholder="Ej. Twisted"></div>
 <div class="field"><label>Autor (opcional)</label><input id="gAuthor"></div>
 ${cat==="saga"?`<div class="field"><label>Cantidad de libros</label><input id="gCount" type="number" min="1" max="30" value="3"></div>`:""}
 <div class="field full"><label>Portadas</label><p class="book-author">Puedes subir una portada diferente para cada libro después de crearlos desde sus fichas. Así no tienes que registrar la portada por URL.</p></div>
 </div><div class="form-actions"><button type="button" class="light-btn" onclick="closeModal()">Cancelar</button><button class="dark-btn" type="button" onclick="saveGroup('${cat}')">Crear ${singular}</button></div></div>`;
 document.getElementById("modalBack").classList.add("show")
}
function saveGroup(cat){const group=document.getElementById("gName").value.trim(),author=document.getElementById("gAuthor").value.trim(),count=cat==="saga"?Math.max(1,+document.getElementById("gCount").value||1):({trilogia:3,bilogia:2,autoconclusivo:1}[cat]);for(let i=1;i<=count;i++){const title=`${group} — Libro ${i}`;if(uniqueBook(title)){continue}state.books.push({id:id(),title,author,cover:"",genre:"",pages:null,rating:0,heart:0,cry:0,spicy:0,plot:0,status:currentTbrTab==="leidos"?"leido":"por-leer",category:cat,group,review:"",favorite:false,year:null,month:null,format:"",durationMinutes:null,startDate:"",endDate:""})}save();closeModal();render();toast(`${group} creada`)}
function openNoteForm(){document.getElementById("modal").innerHTML=`<div class="modal-head"><h3>Nueva nota</h3><button class="close" onclick="closeModal()">×</button></div><form class="form" style="box-shadow:none;padding:18px 0 0" onsubmit="saveNote(event)"><div class="field"><label>Título</label><input id="nTitle"></div><div class="field"><label>Libro relacionado</label><select id="nBook"><option value="">Ninguno</option>${state.books.map(b=>`<option value="${b.id}">${esc(b.title)}</option>`).join("")}</select></div><div class="field"><label>Nota</label><textarea id="nText" required></textarea></div><div class="form-actions"><button type="button" class="light-btn" onclick="closeModal()">Cancelar</button><button class="dark-btn">Guardar</button></div></form>`;document.getElementById("modalBack").classList.add("show")}
function saveNote(e){e.preventDefault();state.notes.push({title:document.getElementById("nTitle").value.trim(),bookId:document.getElementById("nBook").value||null,text:document.getElementById("nText").value.trim(),date:new Date().toLocaleDateString("es-CO")});save();closeModal();render();toast("Nota guardada")}
function deleteNote(i){const idx=Number(i);if(!Number.isInteger(idx)||idx<0||idx>=state.notes.length){toast("No encontré esa nota");return false}state.notes.splice(idx,1);save();render();toast("Nota eliminada");return true}
render();
loadStateFromSupabase();
function openYearInput(){
 document.getElementById("modal").innerHTML=`<div class="modal-head"><h3>＋ Agregar año</h3><button class="close" type="button" onclick="closeModal()">×</button></div>
 <div class="form" style="box-shadow:none;padding:18px 0 0">
  <div class="field"><label>Año</label><input id="yearInput" type="number" min="1900" max="2100" placeholder="2027"></div>
  <div class="form-actions"><button class="light-btn" type="button" onclick="closeModal()">Cancelar</button><button class="dark-btn" type="button" onclick="confirmYearInput()">Agregar año</button></div>

 document.getElementById("modalBack").classList.add("show");
 const input=document.getElementById("yearInput");
 if(input){input.focus();}
}
function confirmYearInput(){

 if(addYear(input?input.value:""))closeModal();
}
